<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모닝데스크 로그인</title><style>body{background:#f5f6ef;font:16px system-ui;color:#23413a;display:grid;place-items:center;min-height:95vh}form{background:white;padding:36px;border-radius:24px;width:min(340px,80vw)}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:13px;margin-top:8px;border:1px solid #dce1d4;border-radius:10px}button{background:#d7e9a2;margin-top:24px;cursor:pointer}p{font-size:14px}</style><form id="login"><h1>모닝데스크</h1><p>로그인하여 내 업무 공간을 여세요.</p><label>아이디<input name="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button><p id="feedback" role="status"></p></form><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw Error(result.error||'로그인 실패');location.reload()}catch(err){document.getElementById('feedback').textContent=err.message}finally{b.disabled=false}};</script></html>
